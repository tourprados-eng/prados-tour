services:
  web:
    image: node:22-slim
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
      - data_store:/app/.data
    environment:
      - NODE_ENV=development
      - DATA_BACKEND=local
      - AUTH_DRIVER=local
      - PORT=3000
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX:-}
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command: sh -c "npm install && npx next dev --turbopack -H 0.0.0.0 -p 3000"
    restart: unless-stopped

volumes:
  node_modules:
  next_cache:
  data_store:
